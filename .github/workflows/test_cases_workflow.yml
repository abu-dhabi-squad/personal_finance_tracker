# This is a basic workflow to help you get started with Actions

name: Check Test Cases

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "dev" branch
  pull_request:
    branches: [ "dev" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Install Kotlin 2.0 via SDKMAN
      - name: Install Kotlin 2.0
        run: |
          # Install SDKMAN
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
                  
          # Install Kotlin 2.0
          sdk install kotlin 2.0.0
                  
           # Verify installation
           echo "Kotlin version: $(kotlin -version)"
           echo "Kotlin compiler version: $(kotlinc -version)"

      # Compile all specified .kt files
      - name: Compile Kotlin source files
        run: |
          mkdir -p out
          kotlinc src/*.kt src/Data/*.kt src/Models/*.kt src/Services/*.kt src/test/*.kt src/Utils/*.kt -include-runtime -d out/compiled.jar

      # Test Execution
      - name: Run Kotlin tests
        run: |
          kotlin -classpath out/compiled.jar test/TestKt
